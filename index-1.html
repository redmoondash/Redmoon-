<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yuna | كل حساباتي</title>
  <meta name="description" content="صفحة yuna — تيك توك وديسكورد، كل حساباتي في مكان واحد.">
  <meta name="theme-color" content="#0b1020">

  <!-- معاينة الرابط (ديسكورد / تيك توك / واتساب): غيّر YOUR-DOMAIN لدومينك بعد الرفع -->
  <meta property="og:title" content="yuna | كل حساباتي">
  <meta property="og:description" content="كل حسابات السوشيال ميديا في صفحة واحدة — تابعني على منصتك المفضلة.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://YOUR-DOMAIN/avatar.jpg">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">

  <style>
    :root {
      --bg: oklch(0.129 0.042 264.695);
      --card: oklch(0.208 0.042 265.755);
      --fg: oklch(0.984 0.003 247.858);
      --muted: oklch(0.704 0.04 256.788);
      --primary: oklch(0.72 0.15 195);
      --primary-fg: oklch(0.15 0.03 250);
      --glow: oklch(0.7 0.19 195);
      --border: oklch(1 0 0 / 10%);
    }
    * { box-sizing: border-box; margin: 0; }
    html { color-scheme: dark; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Tajawal", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg i { position: absolute; border-radius: 50%; display: block; }
    .bg .a { top: -8rem; left: 50%; width: 24rem; height: 24rem; transform: translateX(-50%);
             background: oklch(0.72 0.15 195 / 20%); filter: blur(120px); }
    .bg .b { bottom: 0; left: 0; width: 18rem; height: 18rem;
             background: oklch(0.7 0.19 195 / 15%); filter: blur(100px); }
    .bg .dots { inset: 0; border-radius: 0; background-image: radial-gradient(oklch(1 0 0 / 3%) 1px, transparent 1px);
                background-size: 24px 24px; }

    main {
      position: relative; z-index: 1;
      width: 100%; max-width: 28rem; min-height: 100vh; min-height: 100dvh;
      margin: 0 auto; padding: 3rem 1.25rem;
      display: flex; flex-direction: column; align-items: center;
      padding-top: max(3rem, env(safe-area-inset-top));
      padding-bottom: max(3rem, env(safe-area-inset-bottom));
    }

    .share {
      position: absolute; top: 1.25rem; left: 1.25rem;
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer;
      color: var(--muted); background: oklch(0.208 0.042 265.755 / 60%);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: transform .2s, color .2s;
    }
    .share:hover { transform: scale(1.05); color: var(--fg); }
    .share svg { width: 1rem; height: 1rem; }

    .profile { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .avatar { position: relative; }
    .avatar::before {
      content: ""; position: absolute; inset: -6px; border-radius: 50%; opacity: .8; filter: blur(4px);
      background: linear-gradient(135deg, var(--primary), var(--glow), var(--primary));
    }
    .avatar .pic {
      position: relative; width: 6rem; height: 6rem; border-radius: 50%; overflow: hidden;
      border: 2px solid var(--bg); background: var(--card);
      display: grid; place-items: center; font-size: 2.25rem; font-weight: 800; color: var(--primary);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { margin-top: 1.25rem; font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; }
    .handle { margin-top: .25rem; font-size: .875rem; font-weight: 500; color: var(--primary); }
    .bio { margin-top: .75rem; max-width: 20rem; font-size: .875rem; line-height: 1.6; color: var(--muted); }

    .links { margin-top: 2.25rem; width: 100%; display: flex; flex-direction: column; gap: .75rem; }
    .link {
      display: flex; align-items: center; gap: 1rem; padding: 1rem;
      border-radius: 1rem; border: 1px solid var(--border);
      background: oklch(0.208 0.042 265.755 / 70%);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: inherit; text-decoration: none;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }
    .link:hover { transform: translateY(-2px); border-color: oklch(0.72 0.15 195 / 40%); box-shadow: 0 8px 30px oklch(0 0 0 / 35%); }
    .link:focus-visible, .share:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .ico {
      flex: none; width: 2.75rem; height: 2.75rem; border-radius: .75rem;
      display: grid; place-items: center; color: var(--primary-fg);
      box-shadow: 0 6px 16px oklch(0 0 0 / 30%); transition: transform .3s;
    }
    .link:hover .ico { transform: scale(1.1); }
    .ico svg { width: 1.25rem; height: 1.25rem; }
    .tiktok  { background: linear-gradient(135deg, oklch(0.75 0.15 195), oklch(0.6 0.22 350)); }
    .discord { background: linear-gradient(135deg, oklch(0.6 0.2 280), oklch(0.5 0.18 285)); color: #fff; }
    .txt { flex: 1; min-width: 0; text-align: right; }
    .txt b { display: block; font-weight: 700; }
    .txt small { display: block; font-size: .75rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: right; }
    .arrow { flex: none; width: 1rem; height: 1rem; color: var(--muted); transition: transform .3s, color .3s; }
    .link:hover .arrow { transform: translate(-2px, -2px); color: var(--primary); }

    footer { margin-top: 2.5rem; font-size: .75rem; color: var(--muted); }

    .toast {
      position: fixed; top: 1rem; left: 50%; transform: translate(-50%, -150%); z-index: 10;
      padding: .75rem 1.25rem; border-radius: .75rem; font-size: .875rem; font-weight: 500;
      background: var(--card); border: 1px solid var(--border); box-shadow: 0 8px 30px oklch(0 0 0 / 40%);
      transition: transform .3s; max-width: calc(100vw - 2rem);
    }
    .toast.show { transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="dots"></i></div>

  <main>
    <button class="share" id="share" type="button" aria-label="مشاركة الصفحة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
    </button>

    <section class="profile">
      <div class="avatar">
        <div class="pic" id="pic">
          <!-- ضع صورتك في نفس الفولدر باسم avatar.jpg -->
          <img src="avatar.jpg" alt="yuna" width="96" height="96" id="avatar">
        </div>
      </div>
      <h1>yuna</h1>
      <p class="handle" dir="ltr">@wowthatsmeee</p>
      <p class="bio">كل حساباتي</p>
    </section>

    <nav class="links" aria-label="الروابط">
      <a class="link" href="https://tiktok.com/@wowthatsmeee" target="_blank" rel="noopener noreferrer">
        <span class="ico tiktok">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/></svg>
        </span>
        <span class="txt"><b>تيك توك</b><small>@wowthatsmeee</small></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </a>

      <a class="link" href="https://discord.gg/rdm67" target="_blank" rel="noopener noreferrer">
        <span class="ico discord">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.129 12.299 12.299 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        </span>
        <span class="txt"><b>سيرفر ديسكورد</b><small>discord.gg/rdm67</small></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </a>
    </nav>

    <footer>صفحة واحدة · كل روابطي</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // لو الصورة مش موجودة، يظهر أول حرف من الاسم بدل الأيقونة المكسورة
    var img = document.getElementById("avatar");
    img.addEventListener("error", function () {
      img.remove();
      document.getElementById("pic").textContent = "y";
    });

    var toast = document.getElementById("toast"), timer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(function () { toast.classList.remove("show"); }, 2500);
    }

    document.getElementById("share").addEventListener("click", async function () {
      var url = location.href;
      if (navigator.share) {
        try { await navigator.share({ title: "yuna", url: url }); return; } catch (e) { /* المستخدم لغى */ }
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast("تم نسخ الرابط — شاركه في البايو بتاعك");
      } catch (e) {
        showToast("انسخ الرابط من شريط العنوان");
      }
    });
  </script>
</body>
</html>
